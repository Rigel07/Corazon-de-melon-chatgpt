
name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No hay ningún ZIP en la raíz del repositorio."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: El ZIP no contiene build.gradle."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/${PROJECT_DIR#./}" >> "$GITHUB_ENV"

          echo "Proyecto encontrado en: $PROJECT_DIR"
          test -d "$PROJECT_DIR/src/main/java"
          test -f "$PROJECT_DIR/src/main/resources/META-INF/mods.toml"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar el mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Comprobar el JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          JAR=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se ha generado ningún JAR."
            exit 1
          fi

          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'com/corazondemelon/CorazonDeMelon.class'

          echo "JAR comprobado: $JAR"

      - name: Descargar el mod compilado
        uses: actions/upload-artifact@v4
        with:
          name: corazon-de-melon
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
